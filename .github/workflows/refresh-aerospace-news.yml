name: Refresh aerospace news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-aerospace-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh public feeds
        run: python scripts/update_news.py

      - name: Publish updated feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links/auto-news.json docs/links/auto-news.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
          else
            git commit -m "Refresh aerospace news feed"
            git push
          fi